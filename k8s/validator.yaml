apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: validator-ledger
  namespace: solana-explorer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: validator
  namespace: solana-explorer
spec:
  selector:
    app: validator
  ports:
    - name: rpc
      port: 8899
      targetPort: 8899
    - name: grpc
      port: 10000
      targetPort: 10000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validator
  namespace: solana-explorer
spec:
  replicas: 1
  # Ledger PVC is ReadWriteOnce, so the old pod must stop before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: validator
  template:
    metadata:
      labels:
        app: validator
    spec:
      containers:
        - name: validator
          image: solana-local-indexer-explorer-validator:arm64
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: rpc
              containerPort: 8899
            - name: grpc
              containerPort: 10000
          startupProbe:
            httpGet:
              path: /health
              port: rpc
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: rpc
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: rpc
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: ledger
              mountPath: /ledger
      volumes:
        - name: ledger
          persistentVolumeClaim:
            claimName: validator-ledger
